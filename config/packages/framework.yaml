# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Hôtes acceptés (regex) : empêche de forger les liens absolus des emails avec un faux en-tête Host
    trusted_hosts: '%env(TRUSTED_HOSTS)%'
    # Proxy ou répartiteur de charge devant l'application (ex. AWS ALB) : IP ou plage dans SYMFONY_TRUSTED_PROXIES,
    # pour que l'IP du visiteur (limites de débit) et le HTTPS soient bien reconnus
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']

    #esi: true
    #fragments: true

    http_client:
        default_options:
            headers:
                # Scryfall exige un User-Agent identifiant l'application
                'User-Agent': 'MagicSite/0.1'
        scoped_clients:
            mtgjson.client:
                base_uri: 'https://mtgjson.com/api/v5/'
                timeout: 30
                headers:
                    'Accept': 'application/json'
            scryfall.client:
                base_uri: 'https://api.scryfall.com'
                headers:
                    'Accept': 'application/json'
            commander_spellbook.client:
                base_uri: 'https://backend.commanderspellbook.com'
                timeout: 10
                headers:
                    'Accept': 'application/json'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
